<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>prompt-diff</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background-color: #0d1117;
      color: #c9d1d9;
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      color: #c9d1d9;
      font-family: 'Courier New', monospace;
    }

    .header-stats {
      display: flex;
      gap: 24px;
      font-size: 13px;
      color: #8b949e;
    }

    .stat-item {
      display: flex;
      gap: 8px;
    }

    .stat-label {
      color: #8b949e;
    }

    .stat-value {
      color: #c9d1d9;
      font-weight: bold;
    }

    .token-delta.positive {
      color: #3fb950;
    }

    .token-delta.negative {
      color: #f85149;
    }

    .input-section {
      flex: 0 0 auto;
      background-color: #0d1117;
      padding: 16px 24px;
      border-bottom: 1px solid #30363d;
    }

    .input-container {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
    }

    .input-column {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .input-label {
      font-size: 13px;
      font-weight: bold;
      color: #8b949e;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea {
      flex: 1;
      min-height: 200px;
      background-color: #0d1117;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #00ff88;
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
    }

    textarea::placeholder {
      color: #6e7681;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    button {
      background-color: #00ff88;
      color: #000;
      border: none;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #00dd77;
    }

    button:active {
      background-color: #00cc66;
    }

    .stats-bar {
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 12px 24px;
      font-size: 12px;
      color: #8b949e;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .stats-item {
      display: flex;
      gap: 6px;
    }

    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .diff-panel {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      background-color: #0d1117;
    }

    .side-panel {
      flex: 0 0 280px;
      background-color: #161b22;
      border-left: 1px solid #30363d;
      padding: 16px;
      overflow-y: auto;
      font-size: 12px;
    }

    .panel-section {
      margin-bottom: 16px;
    }

    .panel-title {
      font-weight: bold;
      color: #00ff88;
      margin-bottom: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .panel-content {
      color: #8b949e;
      font-size: 12px;
      line-height: 1.6;
    }

    .diff-line {
      padding: 0 12px;
      border-left: 3px solid transparent;
      display: flex;
      gap: 12px;
    }

    .diff-line.added {
      background-color: #1a3a1a;
      border-left-color: #00ff88;
    }

    .diff-line.removed {
      background-color: #3a1a1a;
      border-left-color: #ff4444;
    }

    .diff-line.context {
      background-color: #161b22;
      color: #8b949e;
    }

    .line-number {
      color: #6e7681;
      width: 40px;
      text-align: right;
      flex-shrink: 0;
      user-select: none;
    }

    .line-content {
      flex: 1;
      word-break: break-all;
      white-space: pre-wrap;
    }

    .char-del {
      background-color: rgba(255, 68, 68, 0.3);
      color: #ff4444;
    }

    .char-ins {
      background-color: rgba(0, 255, 136, 0.3);
      color: #00ff88;
    }

    .turn-view {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .turn-item {
      margin-bottom: 8px;
      padding: 8px;
      background-color: #0d1117;
      border-radius: 3px;
    }

    .turn-role {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      margin-right: 8px;
    }

    .turn-role.system {
      background-color: #a371f7;
      color: #000;
    }

    .turn-role.user {
      background-color: #58a6ff;
      color: #000;
    }

    .turn-role.assistant {
      background-color: #00ff88;
      color: #000;
    }

    .turn-content {
      display: block;
      color: #8b949e;
      font-size: 12px;
      margin-top: 4px;
      word-break: break-word;
      white-space: pre-wrap;
      max-height: 100px;
      overflow-y: auto;
    }

    .toggle-button {
      background-color: #30363d;
      color: #c9d1d9;
      padding: 6px 12px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .toggle-button:hover {
      background-color: #3d444d;
    }

    .empty-state {
      color: #6e7681;
      text-align: center;
      padding: 40px 20px;
      font-style: italic;
    }

    footer {
      background-color: #161b22;
      border-top: 1px solid #30363d;
      padding: 12px 24px;
      font-size: 11px;
      color: #6e7681;
      text-align: center;
    }

    @media (max-width: 1024px) {
      .content {
        flex-direction: column;
      }

      .side-panel {
        flex: 0 0 200px;
        border-left: none;
        border-top: 1px solid #30363d;
      }

      .header-stats {
        font-size: 12px;
        gap: 12px;
      }
    }

    @media (max-width: 768px) {
      .input-container {
        flex-direction: column;
      }

      textarea {
        min-height: 150px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">prompt-diff</div>
    <div class="header-stats">
      <div class="stat-item">
        <span class="stat-label">Left:</span>
        <span class="stat-value" id="leftTokenCount">0</span> tokens
      </div>
      <div class="stat-item">
        <span class="stat-label">Right:</span>
        <span class="stat-value" id="rightTokenCount">0</span> tokens
      </div>
      <div class="stat-item">
        <span class="stat-label">Δ:</span>
        <span class="stat-value token-delta" id="tokenDelta">0</span>
      </div>
    </div>
  </header>

  <div class="input-section">
    <div class="input-container">
      <div class="input-column">
        <div class="input-label">Prompt A</div>
        <textarea id="leftInput" placeholder="Paste your system prompt or conversation JSON here..."></textarea>
      </div>
      <div class="input-column">
        <div class="input-label">Prompt B</div>
        <textarea id="rightInput" placeholder="Paste your system prompt or conversation JSON here..."></textarea>
      </div>
    </div>
    <div class="button-row">
      <button id="diffButton">Diff →</button>
    </div>
  </div>

  <div class="stats-bar" id="statsBar" style="display: none;">
    <div class="stats-item" id="statsContent"></div>
  </div>

  <div class="content">
    <div class="diff-panel" id="diffPanel">
      <div class="empty-state">Paste two prompts and click "Diff →" to compare</div>
    </div>
    <div class="side-panel" id="sidePanel">
      <div class="panel-section">
        <div class="panel-title">Summary</div>
        <div class="panel-content" id="panelContent">Ready to compare</div>
      </div>
    </div>
  </div>

  <footer>port 8009 · local only · no data leaves your machine</footer>

  <script>
    const leftInput = document.getElementById('leftInput');
    const rightInput = document.getElementById('rightInput');
    const diffButton = document.getElementById('diffButton');
    const diffPanel = document.getElementById('diffPanel');
    const sidePanel = document.getElementById('sidePanel');
    const panelContent = document.getElementById('panelContent');
    const statsBar = document.getElementById('statsBar');
    const statsContent = document.getElementById('statsContent');
    const leftTokenCount = document.getElementById('leftTokenCount');
    const rightTokenCount = document.getElementById('rightTokenCount');
    const tokenDelta = document.getElementById('tokenDelta');

    let currentDiff = null;
    let showTurnView = false;

    async function performDiff() {
      const left = leftInput.value;
      const right = rightInput.value;

      if (!left || !right) {
        alert('Please paste both prompts before diffing');
        return;
      }

      try {
        const response = await fetch('/diff', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ left, right }),
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        currentDiff = await response.json();
        renderDiff(currentDiff);
        updateStats(currentDiff);
      } catch (error) {
        alert(`Diff failed: ${error.message}`);
      }
    }

    function updateTokenCounts() {
      const left = leftInput.value;
      const right = rightInput.value;

      if (left) {
        fetch('/tokenize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: left }),
        })
          .then(r => r.json())
          .then(data => {
            leftTokenCount.textContent = data.token_count;
          });
      }

      if (right) {
        fetch('/tokenize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: right }),
        })
          .then(r => r.json())
          .then(data => {
            rightTokenCount.textContent = data.token_count;
          });
      }
    }

    function updateStats(diff) {
      const stats = diff.stats;
      const delta = stats.token_delta;

      leftTokenCount.textContent = stats.left_tokens;
      rightTokenCount.textContent = stats.right_tokens;

      tokenDelta.textContent = `${delta > 0 ? '+' : ''}${delta}`;
      tokenDelta.className = `stat-value token-delta ${delta > 0 ? 'positive' : delta < 0 ? 'negative' : ''}`;

      let statsHtml = `
        <span>${stats.lines_added} lines added, ${stats.lines_removed} removed</span>
      `;

      if (stats.is_json_conversation) {
        statsHtml += `<span>${stats.turns_added} turns added, ${stats.turns_removed} removed</span>`;
        if (stats.roles_changed.length > 0) {
          statsHtml += `<span style="color: #f85149;">${stats.roles_changed.length} role changes</span>`;
        }
      }

      statsContent.innerHTML = statsHtml;
      statsBar.style.display = 'flex';

      updateSidebar(diff);
    }

    function updateSidebar(diff) {
      const stats = diff.stats;
      let html = `
        <div class="panel-section">
          <div class="panel-title">Tokens</div>
          <div class="panel-content">
            ${stats.left_tokens} → ${stats.right_tokens}<br>
            <span style="color: ${stats.token_delta > 0 ? '#3fb950' : '#f85149'};">
              ${stats.token_delta > 0 ? '+' : ''}${stats.token_delta}
            </span>
          </div>
        </div>

        <div class="panel-section">
          <div class="panel-title">Changes</div>
          <div class="panel-content">
            Lines: +${stats.lines_added} -${stats.lines_removed}
          </div>
        </div>
      `;

      if (stats.is_json_conversation) {
        html += `
          <div class="panel-section">
            <div class="panel-title">Conversation</div>
            <div class="panel-content">
              Turns: +${stats.turns_added} -${stats.turns_removed}
              ${stats.roles_changed.length > 0 ? `<br>⚠️ ${stats.roles_changed.length} role changes` : ''}
            </div>
          </div>
        `;
      }

      panelContent.innerHTML = html;
    }

    function renderDiff(diff) {
      const hunks = diff.hunks;
      const stats = diff.stats;
      let html = '';

      if (hunks.length === 0) {
        html = '<div class="empty-state">No differences</div>';
      } else {
        if (stats.is_json_conversation) {
          html += `<button class="toggle-button" onclick="toggleTurnView()">
            ${showTurnView ? '← Back to Diff' : '📋 Show Turns'}
          </button>`;
        }

        if (showTurnView && stats.is_json_conversation) {
          html += renderTurnView(diff);
        } else {
          html += renderUnifiedDiff(hunks);
        }
      }

      diffPanel.innerHTML = html;
    }

    function renderUnifiedDiff(hunks) {
      let html = '';
      let leftLineNum = 1;
      let rightLineNum = 1;

      for (const hunk of hunks) {
        if (hunk.type === 'equal') {
          for (const line of hunk.left_lines) {
            html += `
              <div class="diff-line context">
                <div class="line-number">${leftLineNum}</div>
                <div class="line-content"> ${escapeHtml(line)}</div>
              </div>
            `;
            leftLineNum++;
            rightLineNum++;
          }
        } else if (hunk.type === 'delete') {
          for (const line of hunk.left_lines) {
            html += `
              <div class="diff-line removed">
                <div class="line-number">${leftLineNum}</div>
                <div class="line-content">−${escapeHtml(line)}</div>
              </div>
            `;
            leftLineNum++;
          }
        } else if (hunk.type === 'insert') {
          for (const line of hunk.right_lines) {
            html += `
              <div class="diff-line added">
                <div class="line-number"></div>
                <div class="line-content">+${escapeHtml(line)}</div>
              </div>
            `;
            rightLineNum++;
          }
        } else if (hunk.type === 'replace') {
          const minLen = Math.min(hunk.left_lines.length, hunk.right_lines.length);
          for (let i = 0; i < minLen; i++) {
            const oldLine = hunk.left_lines[i];
            const newLine = hunk.right_lines[i];
            html += `
              <div class="diff-line removed">
                <div class="line-number">${leftLineNum}</div>
                <div class="line-content">−${escapeHtml(oldLine)}</div>
              </div>
            `;
            html += `
              <div class="diff-line added">
                <div class="line-number">${rightLineNum}</div>
                <div class="line-content">+${escapeHtml(newLine)}</div>
              </div>
            `;
            leftLineNum++;
            rightLineNum++;
          }

          for (let i = minLen; i < hunk.left_lines.length; i++) {
            html += `
              <div class="diff-line removed">
                <div class="line-number">${leftLineNum}</div>
                <div class="line-content">−${escapeHtml(hunk.left_lines[i])}</div>
              </div>
            `;
            leftLineNum++;
          }

          for (let i = minLen; i < hunk.right_lines.length; i++) {
            html += `
              <div class="diff-line added">
                <div class="line-number">${rightLineNum}</div>
                <div class="line-content">+${escapeHtml(hunk.right_lines[i])}</div>
              </div>
            `;
            rightLineNum++;
          }
        }
      }

      return html;
    }

    function renderTurnView(diff) {
      try {
        const left = JSON.parse(leftInput.value);
        const right = JSON.parse(rightInput.value);

        let html = '<div style="margin-bottom: 16px;"><strong>Left Conversation:</strong></div>';
        html += '<div class="turn-view">';
        for (const msg of left) {
          html += `
            <div class="turn-item">
              <span class="turn-role ${msg.role}">${msg.role}</span>
              <div class="turn-content">${escapeHtml(msg.content.substring(0, 150))}</div>
            </div>
          `;
        }
        html += '</div>';

        html += '<div style="margin: 16px 0;"><strong>Right Conversation:</strong></div>';
        html += '<div class="turn-view">';
        for (const msg of right) {
          html += `
            <div class="turn-item">
              <span class="turn-role ${msg.role}">${msg.role}</span>
              <div class="turn-content">${escapeHtml(msg.content.substring(0, 150))}</div>
            </div>
          `;
        }
        html += '</div>';

        return html;
      } catch {
        return '<div class="empty-state">Could not parse conversations</div>';
      }
    }

    function toggleTurnView() {
      showTurnView = !showTurnView;
      if (currentDiff) {
        renderDiff(currentDiff);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    diffButton.addEventListener('click', performDiff);
    leftInput.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') performDiff();
    });
    rightInput.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') performDiff();
    });
    leftInput.addEventListener('input', updateTokenCounts);
    rightInput.addEventListener('input', updateTokenCounts);
  </script>
</body>
</html>
